name: Release

# Push a tag like v0.1.0, or run this workflow by hand with a version, to build a signed APK and
# publish it as a GitHub Release. A manual run creates the tag on the commit it built.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version must look like v1.2.3, got $tag"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Keystore and keys from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BUMBLEBEE_KEYSTORE_BASE64 }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the BUMBLEBEE_KEYSTORE_BASE64 secret (see docs/RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUMBLEBEE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # Optional: the Google map display key. Without it the app hides the Google map.
          if [ -n "$MAPS_API_KEY" ]; then echo "MAPS_API_KEY=$MAPS_API_KEY" > local.properties; fi

      - name: Test and build
        env:
          BUMBLEBEE_STORE_PASSWORD: ${{ secrets.BUMBLEBEE_STORE_PASSWORD }}
          BUMBLEBEE_KEY_ALIAS: ${{ secrets.BUMBLEBEE_KEY_ALIAS }}
          BUMBLEBEE_KEY_PASSWORD: ${{ secrets.BUMBLEBEE_KEY_PASSWORD }}
        run: |
          ./gradlew test :app:assembleRelease -PversionName="${TAG}"
          apk="Bumblebee-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat >> notes.md <<'NOTE'

          ---
          ### Install
          1. Download the APK below on your phone.
          2. Play Store → profile picture → Play Protect → ⚙️ → turn off **Scan apps with Play Protect**.
             (It blocks any downloaded app that asks for notification access, which Bumblebee needs to
             read Google Maps' turns for the cluster arrows.)
          3. Open the APK and install. On Xiaomi/HyperOS, wait out the warning and tap Install anyway.
          4. Turn Play Protect scanning back on. The app stays installed.
          5. Android 13+: Settings → Apps → Bumblebee → ⋮ → **Allow restricted settings**, then turn on
             notification access in the app.

          Updates install over the old version and keep your data. Full guide:
          https://github.com/dineshgdk07/VstromDash/blob/main/docs/INSTALL.md

          Not affiliated with, endorsed or sponsored by Suzuki Motor Corporation.
          NOTE

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: ${{ contains(env.TAG, '-') || startsWith(env.TAG, 'v0.') }}
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
